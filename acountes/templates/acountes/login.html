{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - Smart BI</title>
    <link rel="stylesheet" href="{% static 'acountes/style.css' %}">
</head>
<body>
<div class="login-container">
    <h2>Login to Smart BI</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</div>
</body>
</html>
